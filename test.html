<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎯 Quiz Game – Discord Activity</title>

    <!-- Discord Embedded App SDK -->
    <script src="https://unpkg.com/@discord/embedded-app-sdk@latest/dist/embedded-app-sdk.js">
    </script>

    <style>
        /* ---------- RESET & GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #1e1f29 0%, #2a2d3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            max-width: 700px;
            width: 100%;
            background: rgba(44, 47, 60, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 25px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(88, 101, 242, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* ---------- HEADER ---------- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .game-title {
            font-size: 26px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .score-box {
            background: #40435a;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 20px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .score-box span {
            color: #ffd700;
        }

        /* ---------- PROGRESS BAR ---------- */
        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #35384a;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #43e97b, #38f9d7);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 15px rgba(67, 233, 123, 0.4);
        }

        /* ---------- QUESTION CARD ---------- */
        .question-card {
            background: #363a4b;
            border-radius: 24px;
            padding: 25px 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 #21232f;
            transition: transform 0.15s ease;
        }

        .question-text {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 5px;
            min-height: 70px;
        }

        .question-category {
            font-size: 14px;
            color: #b0b8d1;
            background: #2f3344;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            margin-bottom: 15px;
        }

        /* ---------- ANSWERS (GRID) ---------- */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .answer-btn {
            background: #2f3346;
            border: none;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 17px;
            font-weight: 500;
            color: #f0f2fa;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #1d1f2b;
            text-align: left;
            word-break: break-word;
            position: relative;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #3d425a;
            box-shadow: 0 7px 0 #1d1f2b;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1d1f2b;
        }

        .answer-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #1d1f2b;
        }

        .answer-btn.correct {
            background: #2ecc71;
            box-shadow: 0 5px 0 #1a7a44;
        }

        .answer-btn.wrong {
            background: #e74c3c;
            box-shadow: 0 5px 0 #922b21;
        }

        .answer-btn.reveal-correct {
            background: #2ecc71;
            box-shadow: 0 5px 0 #1a7a44;
        }

        /* ---------- FEEDBACK & STATUS ---------- */
        .feedback-area {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 500;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feedback-area.correct {
            color: #2ecc71;
        }
        .feedback-area.wrong {
            color: #e74c3c;
        }

        /* ---------- START / END SCREEN ---------- */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0;
            animation: fadeSlideUp 0.6s ease forwards;
        }

        .screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .screen p {
            font-size: 20px;
            color: #c0c7e0;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: #5865f2;
            border: none;
            border-radius: 40px;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #3b45b0;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: #6d7af5;
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #3b45b0;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #3b45b0;
        }

        .end-score {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .end-stars {
            font-size: 40px;
            margin: 5px 0 15px;
        }

        .end-message {
            font-size: 22px;
            color: #d0d7f0;
            margin-bottom: 20px;
        }

        /* ---------- ANIMATIONS ---------- */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            70% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-10px);
            }
            40% {
                transform: translateX(10px);
            }
            60% {
                transform: translateX(-6px);
            }
            80% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        @keyframes confettiDrop {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(720deg);
                opacity: 0;
            }
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 999;
            animation: confettiDrop 2s ease-out forwards;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 550px) {
            .game-container {
                padding: 20px 15px;
                border-radius: 28px;
            }
            .game-title {
                font-size: 20px;
            }
            .question-text {
                font-size: 18px;
            }
            .answers-grid {
                grid-template-columns: 1fr;
            }
            .answer-btn {
                padding: 12px 14px;
                font-size: 15px;
            }
            .screen h1 {
                font-size: 34px;
            }
            .end-score {
                font-size: 50px;
            }
        }

        /* ---------- HIDDEN ---------- */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="game-container" id="app">
        <!-- HEADER -->
        <div class="game-header">
            <div class="game-title">🎯 Quiz Game</div>

    <script>
        // ============================================================
        //  1.  DISCORD SDK SETUP (optional – for embedded app)
        // ============================================================
        const APP_ID = 'YOUR_APPLICATION_ID'; // <-- CHANGE THIS
        let sdk = null;
        let channelId = null;

        async function initDiscord() {
            try {
                sdk = new window.DiscordEmbeddedAppSDK(APP_ID);
                const { channelId: cid } = await sdk.commands.getChannel();
                channelId = cid;
                console.log('✅ Discord SDK connected, channel:', channelId);
            } catch (e) {
                console.warn('⚠️ Discord SDK not available or not in embedded context. Running standalone.');
            }
        }
        initDiscord();

        // ============================================================
        //  2.  AUDIO ENGINE (Web Audio API – no external files)
        // ============================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.3) {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Silently fail if audio not available
            }
        }

        function soundCorrect() {
            // Ascending happy tone
            playTone(523, 0.12);
            setTimeout(() => playTone(659, 0.12), 100);
            setTimeout(() => playTone(784, 0.18), 200);
        }

        function soundWrong() {
            // Descending buzz
            playTone(300, 0.25, 'sawtooth', 0.2);
            setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.2), 120);
        }

        function soundFanfare() {
            // Simple celebratory arpeggio
            const notes = [523, 659, 784, 1047];
            notes.forEach((n, i) => {
                setTimeout(() => playTone(n, 0.2, 'sine', 0.25), i * 150);
            });
        }

        function soundStart() {
            playTone(440, 0.15);
            setTimeout(() => playTone(554, 0.15), 120);

        const QUESTION_POOL = [

        // ============================================================
        //  4.  GAME STATE
        // ============================================================
        const TOTAL_QUESTIONS = 20;
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let timer = null;

        // DOM refs
        const startScreen = document.getElementById('startScreen');
        const quizArea = document.getElementById('quizArea');
        const endScreen = document.getElementById('endScreen');
        const questionText = document.getElementById('questionText');
        const categoryDisplay = document.getElementById('categoryDisplay');
        const answersContainer = document.getElementById('answersContainer');
        const feedback = document.getElementById('feedback');
        const progressBar = document.getElementById('progressBar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const starsDisplay = document.getElementById('starsDisplay');
        const endMessage = document.getElementById('endMessage');

        // ============================================================
        //  5.  GAME FUNCTIONS
        // ============================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pickQuestions(pool, count) {
            const shuffled = shuffleArray([...pool]);
            return shuffled.slice(0, count);
        }

        function startGame() {
            soundStart();
            questions = pickQuestions(QUESTION_POOL, TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            answered = false;
            updateScore();
            updateProgress();
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                endGame();
                return;
            }
            const q = questions[currentIndex];
            questionText.textContent = q.q;
            categoryDisplay.textContent = q.cat;
            feedback.textContent = '';
            feedback.className = 'feedback-area';
            answered = false;

            // Build answer buttons
            answersContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = `${labels[idx]}. ${opt}`;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => handleAnswer(idx));
                answersContainer.appendChild(btn);
            });

            // Enable all buttons
            document.querySelectorAll('.answer-btn').forEach(b => b.disabled = false);

            // Animate question card
            const card = document.querySelector('.question-card');
            card.style.animation = 'none';
            requestAnimationFrame(() => {
                card.style.animation = 'popIn 0.35s ease forwards';
            });
        }

        function handleAnswer(selectedIdx) {
            if (answered) return;
            answered = true;
            const q = questions[currentIndex];
            const isCorrect = (selectedIdx === q.ans);

            // Disable all buttons
            document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);

            // Highlight correct/wrong
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach((btn, idx) => {
                if (idx === q.ans) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            // Update score
            if (isCorrect) {
                score += 10;
                soundCorrect();
                feedback.textContent = '✅ Correct! +10 pts';
                feedback.className = 'feedback-area correct';
            } else {
                soundWrong();
                feedback.textContent = `❌ Wrong! The answer was: ${q.opts[q.ans]}`;
                feedback.className = 'feedback-area wrong';
                // shake container
                const container = document.querySelector('.game-container');
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
            }

            updateScore();
            updateProgress();

            // Move to next question after delay
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                currentIndex++;
                showQuestion();
            }, 1800);
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function updateProgress() {
            const pct = (currentIndex / TOTAL_QUESTIONS) * 100;
            progressBar.style.width = `${pct}%`;
        }

        function endGame() {
            showScreen('end');
            finalScore.textContent = score;
            const stars = score >= 180 ? '⭐⭐⭐' : score >= 120 ? '⭐⭐' : '⭐';
            starsDisplay.textContent = stars;
            const messages = {
                '⭐⭐⭐': '🏆 Outstanding! You\'re a quiz master!',
                '⭐⭐': '👍 Great job! Keep learning!',
                '⭐': '📚 Good effort! Study more and try again!'
            };
            endMessage.textContent = messages[stars] || 'Thanks for playing!';
            soundFanfare();
            // Confetti for high score
            if (score >= 150) launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = '-10px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (Math.random() * 8 + 4) + 'px';
                piece.style.height = (Math.random() * 8 + 4) + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 3000);
            }
        }

        function showScreen(screen) {
            startScreen.classList.add('hidden');
            quizArea.classList.add('hidden');
            endScreen.classList.add('hidden');
            if (screen === 'start') startScreen.classList.remove('hidden');
            else if (screen === 'quiz') quizArea.classList.remove('hidden');
            else if (screen === 'end') endScreen.classList.remove('hidden');
        }

        // ============================================================
        //  6.  EVENT LISTENERS
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            startGame();
        });

        // Show start screen initially
        showScreen('start');

        // ============================================================
        //  7.  OPTIONAL: SEND SCORE TO DISCORD CHANNEL (via SDK)
        // ============================================================
        async function sendScoreToDiscord(score, total) {
            if (!sdk || !channelId) return;
            try {
                await sdk.commands.sendMessage({
                    channelId: channelId,
                    content: `🎯 **Quiz finished!** I scored **${score}** out of **${total * 10}** points! 🏆`,
                });
            } catch (e) {
                console.warn('Could not send message to Discord:', e);
            }
        }

        // Override endGame to optionally send score
        const originalEnd = endGame;
        endGame = function() {
            originalEnd();
            if (score > 0) {
                sendScoreToDiscord(score, TOTAL_QUESTIONS);
            }
        };

        console.log('🎯 Quiz Game loaded! Ready to play.');
    </script>
</body>
</html>
